name: Fork updater focused tests
on:
  push:
    branches: ["codex/update-tests/**"]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: fork-update-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install focused test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev libssl-dev liblzma-dev
      - name: Test isolated signer and native feed verification
        run: |
          python3 Telegram/build/no-stories/test_fork_update_tools.py
          python3 Telegram/build/no-stories/test_fork_update_native.py
  windows-transaction:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          vsversion: '2022'
          toolset: '14.44'
      - name: Compile exact shipping file transaction
        run: |
          New-Item -ItemType Directory -Force -Path out/fork-tests | Out-Null
          cl /nologo /std:c++20 /EHsc /W4 /WX /utf-8 /DNOMINMAX /DUNICODE /D_UNICODE /I Telegram/SourceFiles Telegram/SourceFiles/_other/fork_update_install_win.cpp Telegram/SourceFiles/tests/test_fork_update_install_win.cpp /Fo:out/fork-tests/ /Fe:out/fork-tests/test-fork-install.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile file transaction.' }
      - name: Verify replacement, account isolation and rollback
        run: |
          & ./out/fork-tests/test-fork-install.exe
          if ($LASTEXITCODE -ne 0) { throw 'File transaction checks failed.' }
