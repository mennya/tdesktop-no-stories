name: No Stories Windows x64

on:
  push:
    branches: [codex/no-stories, "codex/candidate/**"]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/release-watch.yml'
      - '.github/scripts/release_watch.py'
      - '.github/scripts/test_release_watch.py'
      - '.github/release-watch-config.json'
  workflow_dispatch:
    inputs:
      build_kind:
        description: Release branch build kind; candidate branches always use test credentials
        type: choice
        options: [production, verification]
        default: production
        required: true

permissions:
  contents: read

concurrency:
  group: no-stories-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/codex/no-stories' }}

env:
  PIPELINE: ${{ github.ref == 'refs/heads/codex/no-stories' && 'production' || 'validation' }}
  BUILD_KIND: ${{ github.ref != 'refs/heads/codex/no-stories' && 'verification' || github.event_name == 'workflow_dispatch' && inputs.build_kind || 'production' }}
  SDK_VERSION: 10.0.26100.0
  MSVC_TOOLSET: '14.44'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      pipeline: ${{ steps.plan.outputs.pipeline }}
      base_commit: ${{ steps.plan.outputs.base_commit }}
    steps:
      - name: Checkout exact source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind validation baseline or require checked release commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Telegram/build/no-stories/ci.py plan

  regression-models:
    needs: pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install focused verifier test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev libssl-dev liblzma-dev

      - name: Check signed fork update artifacts and native verifier
        run: |
          python3 Telegram/build/no-stories/test_fork_update_tools.py
          python3 Telegram/build/no-stories/test_publish_update.py
          python3 Telegram/build/no-stories/test_fork_update_native.py

      - name: Check extracted production behavior and object selection
        run: |
          python3 Telegram/build/no-stories/test_ci.py
          python3 Telegram/build/no-stories/test_changed.py
          python3 Telegram/build/no-stories/test_personal_userpics.py
          python3 Telegram/build/no-stories/test_strict_mute_order.py
          python3 Telegram/build/no-stories/test_strict_mute_unread.py
          python3 Telegram/build/no-stories/test_strict_mute_calls.py
          python3 Telegram/build/no-stories/test_strict_mute_notifications.py
          python3 Telegram/build/no-stories/test_build.py --integration required

  windows:
    name: Windows ${{ needs.pipeline.outputs.pipeline }}
    needs: [pipeline, regression-models]
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Create dependency root
        run: |
          $buildRoot = Join-Path $env:USERPROFILE 'TBuild'
          New-Item -ItemType Directory -Force -Path "$buildRoot\Libraries\win64", "$buildRoot\ThirdParty" | Out-Null
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\TBuild" -Target $buildRoot | Out-Null

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: TBuild/tdesktop
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate API configuration for this pipeline
        env:
          TDESKTOP_API_ID: ${{ github.ref == 'refs/heads/codex/no-stories' && secrets.TDESKTOP_API_ID || '' }}
          TDESKTOP_API_HASH: ${{ github.ref == 'refs/heads/codex/no-stories' && secrets.TDESKTOP_API_HASH || '' }}
        run: python TBuild/tdesktop/Telegram/build/no-stories/configure.py --validate-only

      - name: Initialize MSVC x64
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          vsversion: '2022'
          sdk: ${{ env.SDK_VERSION }}
          toolset: ${{ env.MSVC_TOOLSET }}

      - name: Verify matching MSVC and ATL before dependencies
        run: ./TBuild/tdesktop/Telegram/build/no-stories/verify-toolchain.ps1

      - name: Configure dependency preparation
        run: |
          git config --global user.name 'Dependency patch builder'
          git config --global user.email 'builder@localhost'
          nuget sources Disable -Name 'Microsoft Visual Studio Offline Packages'
          $sources = nuget sources List -Format Short
          if (-not ($sources -match 'https://api.nuget.org/v3/index.json')) {
            nuget sources Add -Name nuget.org -Source 'https://api.nuget.org/v3/index.json'
            if ($LASTEXITCODE -ne 0) { throw 'Could not configure NuGet.' }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
          "CACHE_KEY=win-x64-vs2022-$env:MSVC_TOOLSET-$env:SDK_VERSION-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/prepare.py', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}" >> $env:GITHUB_ENV

      - name: Restore build tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: TBuild/ThirdParty
          key: tools-${{ env.CACHE_KEY }}
          restore-keys: tools-win-x64-vs2022-

      - name: Restore Release dependencies
        id: libraries-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries/win64/*
            !TBuild/Libraries/win64/cache_keys
            !TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/*
            !TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: release-libraries-v2-${{ env.CACHE_KEY }}
          restore-keys: release-libraries-v2-win-x64-vs2022-

      - name: Restore Qt Release dependencies
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: release-qt-v2-${{ env.CACHE_KEY }}
          restore-keys: release-qt-v2-win-x64-vs2022-

      - name: Prepare dependencies including Release libraries
        shell: cmd
        run: call TBuild\tdesktop\Telegram\build\prepare\win.bat silent qt6

      - name: Remove disposable dependency build products
        run: ./TBuild/tdesktop/Telegram/build/no-stories/prune-dependencies.ps1

      - name: Save build tools before compiling application
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: TBuild/ThirdParty
          key: tools-${{ env.CACHE_KEY }}

      - name: Save Release dependencies before compiling application
        if: steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries/win64/*
            !TBuild/Libraries/win64/cache_keys
            !TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/*
            !TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: release-libraries-v2-${{ env.CACHE_KEY }}

      - name: Save Qt dependencies before compiling application
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: release-qt-v2-${{ env.CACHE_KEY }}

      - name: Configure fork with its signed update channel
        env:
          TDESKTOP_API_ID: ${{ github.ref == 'refs/heads/codex/no-stories' && secrets.TDESKTOP_API_ID || '' }}
          TDESKTOP_API_HASH: ${{ github.ref == 'refs/heads/codex/no-stories' && secrets.TDESKTOP_API_HASH || '' }}
        run: python TBuild/tdesktop/Telegram/build/no-stories/configure.py

      - name: Build focused shipping updater tests
        run: cmake --build "$env:USERPROFILE/TBuild/tdesktop/out" --config Release --target test_update_verify test_fork_update test_fork_update_install --parallel 4

      - name: Run focused shipping updater tests
        run: |
          & "$env:USERPROFILE/TBuild/tdesktop/out/Release/test_update_verify.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native update verification tests failed.' }
          & "$env:USERPROFILE/TBuild/tdesktop/out/Release/test_fork_update.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Fork feed and native extraction tests failed.' }
          & "$env:USERPROFILE/TBuild/tdesktop/out/Release/test_fork_update_install.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Transactional Windows update tests failed.' }

      - name: Verify exact Release object build selection
        run: python TBuild/tdesktop/Telegram/build/no-stories/test_build.py --integration required

      - name: Verify generated Qt plugin compilation
        run: python TBuild/tdesktop/Telegram/build/no-stories/build.py --target external_qt_static_plugins_kimageformats

      - name: Compile changed Windows inputs with bounded multi-error diagnostics
        if: env.PIPELINE == 'validation'
        env:
          VALIDATION_BASE: ${{ needs.pipeline.outputs.base_commit }}
        run: python TBuild/tdesktop/Telegram/build/no-stories/build.py --target changed-objects --base-commit $env:VALIDATION_BASE --max-failures 8

      - name: Build Windows x64 Release
        if: env.PIPELINE == 'production'
        run: python TBuild/tdesktop/Telegram/build/no-stories/build.py

      - name: Package isolated portable and installer
        if: env.PIPELINE == 'production'
        run: python TBuild/tdesktop/Telegram/build/no-stories/package.py --output artifacts

      - name: Build and package successor for update acceptance
        if: env.PIPELINE == 'production' && env.BUILD_KIND == 'production'
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          $env:FORK_BUILD_COUNTER = python -c "import sys; sys.path.insert(0,'TBuild/tdesktop/Telegram/build/no-stories'); from fork_update_tools import counter_from_env; print(counter_from_env()+1)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not select successor build counter.' }
          python TBuild/tdesktop/Telegram/build/no-stories/configure.py
          if ($LASTEXITCODE -ne 0) { throw 'Successor configuration failed.' }
          python TBuild/tdesktop/Telegram/build/no-stories/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Successor build failed.' }
          python TBuild/tdesktop/Telegram/build/no-stories/package.py --output artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Successor packaging failed.' }

      - name: Upload native verifier
        if: env.PIPELINE == 'production' && env.BUILD_KIND == 'production'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fork-update-verifier-${{ github.run_number }}
          path: |
            ~/TBuild/tdesktop/out/Release/test_fork_update.exe
            ~/TBuild/tdesktop/out/Release/*.dll
          if-no-files-found: error
          retention-days: 30

      - name: Upload packages and checksums
        if: env.PIPELINE == 'production'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: no-stories-windows-x64-${{ env.BUILD_KIND }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
