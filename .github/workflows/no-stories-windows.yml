name: No Stories Windows x64

on:
  push:
    branches: [codex/no-stories]
  workflow_dispatch:
    inputs:
      build_kind:
        description: Production requires your own Telegram API secrets
        type: choice
        options: [production, verification]
        default: production
        required: true

permissions:
  contents: read

concurrency:
  group: no-stories-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.build_kind || 'production' }}
  SDK_VERSION: 10.0.26100.0
  MSVC_TOOLSET: '14.44'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Create dependency root
        run: |
          $buildRoot = Join-Path $env:USERPROFILE 'TBuild'
          New-Item -ItemType Directory -Force -Path "$buildRoot\Libraries\win64", "$buildRoot\ThirdParty" | Out-Null
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\TBuild" -Target $buildRoot | Out-Null

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: TBuild/tdesktop
          submodules: recursive
          persist-credentials: false

      - name: Validate production credentials
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: python TBuild/tdesktop/Telegram/build/no-stories/configure.py --validate-only

      - name: Initialize MSVC x64
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ env.SDK_VERSION }}
          toolset: ${{ env.MSVC_TOOLSET }}

      - name: Configure dependency preparation
        run: |
          git config --global user.name 'Dependency patch builder'
          git config --global user.email 'builder@localhost'
          nuget sources Disable -Name 'Microsoft Visual Studio Offline Packages'
          $sources = nuget sources List -Format Short
          if (-not ($sources -match 'https://api.nuget.org/v3/index.json')) {
            nuget sources Add -Name nuget.org -Source 'https://api.nuget.org/v3/index.json'
            if ($LASTEXITCODE -ne 0) { throw 'Could not configure NuGet.' }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
          "CACHE_KEY=win-x64-vs2026-$env:MSVC_TOOLSET-$env:SDK_VERSION-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/prepare.py', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}" >> $env:GITHUB_ENV

      - name: Restore build tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: TBuild/ThirdParty
          key: tools-${{ env.CACHE_KEY }}
          restore-keys: tools-win-x64-vs2026-

      - name: Restore Release dependencies
        id: libraries-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries/win64/*
            !TBuild/Libraries/win64/cache_keys
            !TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/*
            !TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: release-libraries-v2-${{ env.CACHE_KEY }}
          restore-keys: release-libraries-v2-win-x64-vs2026-

      - name: Restore Qt Release dependencies
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: release-qt-v2-${{ env.CACHE_KEY }}
          restore-keys: release-qt-v2-win-x64-vs2026-

      - name: Prepare dependencies including Release libraries
        shell: cmd
        run: call TBuild\tdesktop\Telegram\build\prepare\win.bat silent qt6

      - name: Remove disposable dependency build products
        run: ./TBuild/tdesktop/Telegram/build/no-stories/prune-dependencies.ps1

      - name: Save build tools before compiling application
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: TBuild/ThirdParty
          key: tools-${{ env.CACHE_KEY }}

      - name: Save Release dependencies before compiling application
        if: steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries/win64/*
            !TBuild/Libraries/win64/cache_keys
            !TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/*
            !TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: release-libraries-v2-${{ env.CACHE_KEY }}

      - name: Save Qt dependencies before compiling application
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: release-qt-v2-${{ env.CACHE_KEY }}

      - name: Configure fork with official updates disabled
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: python TBuild/tdesktop/Telegram/build/no-stories/configure.py

      - name: Build Windows x64 Release
        run: |
          cmake --build TBuild/tdesktop/out --config Release --target Telegram --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Telegram build failed.' }

      - name: Package isolated portable and installer
        run: python TBuild/tdesktop/Telegram/build/no-stories/package.py --output artifacts

      - name: Upload packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: no-stories-windows-x64-${{ env.BUILD_KIND }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
